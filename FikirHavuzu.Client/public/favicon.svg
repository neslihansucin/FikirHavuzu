<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Soft Ferah Havuz Zemini Gradyanı -->
    <linearGradient id="poolSoftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E876A" />
      <stop offset="100%" stop-color="#36654F" />
    </linearGradient>

    <!-- Parlayan Altın İnovasyon Yıldızı -->
    <linearGradient id="starGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Su Dalgaları Gradyanı -->
    <linearGradient id="waterSoftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Yumuşak Işıma Efekti -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Dış Yuvarlak Havuz Rozeti (Soft Yeşil Zemin) -->
  <circle cx="24" cy="24" r="22" fill="url(#poolSoftGrad)" stroke="#A7D7BC" stroke-width="1.5" />

  <!-- 2. Sudan Yükselen 4 Köşeli Parlayan Yıldız (✦) -->
  <path d="M 24 5 
           Q 24 16, 35 16 
           Q 24 16, 24 28 
           Q 24 16, 13 16 
           Q 24 16, 24 5 Z" 
        fill="url(#starGlowGrad)" 
        filter="url(#softGlow)" />

  <!-- Yıldız İçi Parlak Çekirdek -->
  <circle cx="24" cy="16" r="2.2" fill="#FFFFFF" opacity="0.9" />

  <!-- 3. Yıldızın Üzerinden Aşağı Süzülen Su Damlacıkları -->
  <path d="M 24 29 C 23 30.5, 23 32, 24 33 C 25 32, 25 30.5, 24 29 Z" fill="#7DD3FC" opacity="0.9" />
  <circle cx="24" cy="35" r="0.9" fill="#BAE6FD" opacity="0.8" />
  <path d="M 16 20 C 15.2 21, 15.2 22, 16 22.5 C 16.8 22, 16.8 21, 16 20 Z" fill="#7DD3FC" opacity="0.85" />
  <path d="M 32 20 C 31.2 21, 31.2 22, 32 22.5 C 32.8 22, 32.8 21, 32 20 Z" fill="#7DD3FC" opacity="0.85" />

  <!-- 4. Dalgalı Havuz Suyu Katmanları (En Altta) -->
  <path d="M 4 33 Q 14 29, 24 33 T 44 33 A 22 22 0 0 1 4 33 Z" fill="url(#waterSoftGrad)" opacity="0.75" />
  <path d="M 4 37 Q 14 34, 24 37 T 44 37 A 22 22 0 0 1 4 37 Z" fill="#0284C7" opacity="0.6" />
  <path d="M 4 33 Q 14 29, 24 33 T 44 33" fill="none" stroke="#E0F2FE" stroke-width="1.2" opacity="0.9" />
</svg>
