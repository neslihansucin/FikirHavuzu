version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: fikirhavuzu-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    restart: unless-stopped

  kibana:
    image: kibana:8.10.2
    container_name: fikirhavuzu-kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: fikirhavuzu-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts
    container_name: fikirhavuzu-jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

volumes:
  jenkins_home:
